# SNS/SQS through the AWS SDK v2 (real AWS or LocalStack). The resource settings live in application.yml
# (app.messaging.aws.*, read from AWS_REGION, SNS_ORDER_TOPIC_*, SQS_ORDER_QUEUE_*, SQS_ORDER_DLQ_*) and are
# required with this profile. Credentials come only from the SDK's default provider chain.
app:
  messaging:
    provider: aws
    consumer:
      # SQS long polling: one receive call waits up to this long for messages (max 20s).
      wait-time: ${MESSAGING_CONSUMER_WAIT_TIME:10s}
