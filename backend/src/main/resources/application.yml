# Default profile: H2 in-memory database + in-memory SNS/SQS. No external services needed.
spring:
  application:
    name: subscription-order-platform
  datasource:
    url: jdbc:h2:mem:subscriptions;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  seed:
    enabled: true
  billing:
    max-catch-up-cycles: 12
    scheduler:
      enabled: true
      cron: "0 0 6 * * *"
      zone: UTC
  outbox:
    relay-interval: PT5S
    batch-size: 100
  messaging:
    # in-memory | aws
    provider: in-memory
    max-receive-count: 3
    visibility-timeout: 30s
    retry-backoff: 2s
    consumer:
      enabled: true
      batch-size: 10
      wait-time: 5s
  processing:
    simulated-latency: 400ms
    failure-injection:
      # NONE | TRANSIENT | PERMANENT
      mode: NONE

logging:
  level:
    com.subscriptionplatform: INFO
