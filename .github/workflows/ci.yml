# Build and test both apps, build both Docker images and smoke-test them together (PostgreSQL + LocalStack).
# On pushes to main the tested images are published to GitHub Container Registry.
#
# No repository secrets are needed: tests run on H2 with the in-memory broker, the compose stack gets a freshly
# generated .env, and the GHCR push authenticates with the workflow's built-in GITHUB_TOKEN.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - mvn verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and integration tests (H2 + in-memory SNS/SQS)
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend - typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images, compose smoke test, publish
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate .env for the compose stack (random POSTGRES_PASSWORD, never committed)
        run: scripts/init-env.sh

      - name: Image names (GHCR paths must be lowercase)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE_NAME=ghcr.io/${owner}/subscription-order-platform-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_NAME=ghcr.io/${owner}/subscription-order-platform-frontend" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          load: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Start the stack (PostgreSQL, LocalStack SNS/SQS, backend, frontend)
        env:
          BACKEND_IMAGE: ${{ fromJSON(steps.backend-meta.outputs.json).tags[0] }}
          FRONTEND_IMAGE: ${{ fromJSON(steps.frontend-meta.outputs.json).tags[0] }}
        run: docker compose up --detach --no-build --wait --wait-timeout 300

      - name: Smoke test through nginx (fulfilment, DLQ after maxReceiveCount, replay)
        run: node scripts/smoke-test.mjs http://localhost:3000/graphql

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested images
        if: env.PUBLISH == 'true'
        run: |
          docker push --all-tags "$BACKEND_IMAGE_NAME"
          docker push --all-tags "$FRONTEND_IMAGE_NAME"
