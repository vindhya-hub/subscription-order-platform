# Full stack: PostgreSQL, LocalStack (SNS + SQS), the Spring Boot backend and the React UI behind nginx.
#
#   scripts/init-env.sh          # once: creates .env from .env.example with a random POSTGRES_PASSWORD
#   docker compose up --build    # UI on http://localhost:3000, API on http://localhost:8080/graphql
#
# All configuration comes from .env (gitignored). No secret is written in this file.
name: subscription-order-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subscriptions}
      POSTGRES_USER: ${POSTGRES_USER:-subscriptions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run scripts/init-env.sh to create .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  localstack:
    # Pinned on purpose: 4.14 is the last LocalStack release that starts without an auth token
    # (2026.x releases require LOCALSTACK_AUTH_TOKEN).
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      # Read by localstack/init-aws.sh.
      SNS_ORDER_TOPIC_NAME: ${SNS_ORDER_TOPIC_NAME:-order-events}
      SQS_ORDER_QUEUE_NAME: ${SQS_ORDER_QUEUE_NAME:-order-processing}
      SQS_ORDER_DLQ_NAME: ${SQS_ORDER_DLQ_NAME:-order-processing-dlq}
      MESSAGING_MAX_RECEIVE_COUNT: ${MESSAGING_MAX_RECEIVE_COUNT:-3}
    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      # Healthy only once the init script has created the topic and queues.
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/init/ready | grep -Eq '\"completed\": ?true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-subscription-order-platform-backend:local}
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    # Application settings (AWS_REGION, SNS_/SQS_ names, BILLING_CRON, FAILURE_INJECTION_*, CORS_ALLOWED_ORIGINS, ...).
    env_file:
      - path: .env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: postgres,aws
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-subscriptions}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-subscriptions}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run scripts/init-env.sh to create .env}
      AWS_ENDPOINT_URL: http://localstack:4566
      # LocalStack accepts any credentials; "test"/"test" are its documented dummy values, NOT real AWS keys.
      # Against real AWS remove both lines: the SDK's default provider chain then uses the task/instance role.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-/graphql}
    image: ${FRONTEND_IMAGE:-subscription-order-platform-frontend:local}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
